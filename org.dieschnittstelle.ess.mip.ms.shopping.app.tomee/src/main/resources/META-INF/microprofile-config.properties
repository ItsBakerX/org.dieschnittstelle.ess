# =====================================================================
# MicroProfile Rest Client configuration for the SHOPPING microservice
# =====================================================================
# The shopping domain (PurchaseServiceImpl) accesses beans of the crm and erp
# domains. In the microservices deployment these beans are provided by the crm
# microservice (port 7081) and the erp microservice (port 7082), each exposing
# its web api under the application path /api.
#
# Format: <fully-qualified-interface-name>/mp-rest/url=<root-url-of-the-web-api>
# The @Path of the respective interface is appended to this root url.

# --- beans accessed from the crm microservice (port 7081) ---
org.dieschnittstelle.ess.mip.components.crm.api.CampaignTracking/mp-rest/url=http://localhost:7081/api
org.dieschnittstelle.ess.mip.components.crm.api.CustomerTracking/mp-rest/url=http://localhost:7081/api
org.dieschnittstelle.ess.mip.components.crm.api.TouchpointAccess/mp-rest/url=http://localhost:7081/api
org.dieschnittstelle.ess.mip.components.crm.crud.api.CustomerCRUD/mp-rest/url=http://localhost:7081/api

# --- beans accessed from the erp microservice (port 7082) ---
org.dieschnittstelle.ess.mip.components.erp.crud.api.ProductCRUD/mp-rest/url=http://localhost:7082/api
org.dieschnittstelle.ess.mip.components.erp.api.StockSystemService/mp-rest/url=http://localhost:7082/api
